name: publish

# Upload to PyPI when a version tag (vX.Y.Z) is pushed on a commit of main.
# The tag must match `version` in pyproject.toml, and the full test matrix must pass.
# Uses PyPI trusted publishing: add this repository / workflow `publish.yml` /
# environment `pypi` as a (pending) publisher of `noisechisel-torch` on pypi.org.

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag is on main and matches the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1; }

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noisechisel-torch/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pip:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch (Linux/Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -v

  gnuastro:
    # Bit-exact comparison with astnoisechisel (Gnuastro is not packaged for Windows).
    name: vs Gnuastro / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nc
          create-args: >-
            python=${{ matrix.python-version }}
            gnuastro=0.24
            pytorch
            numpy
            scipy
            astropy
            pytest
            pip
          channels: conda-forge
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Run tests (including test_identical_to_gnuastro)
        run: |
          astnoisechisel --version | head -1
          python -m pytest -v -rs
